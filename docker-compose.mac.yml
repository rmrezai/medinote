services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medinote
      POSTGRES_PASSWORD: medinote_local_only
      POSTGRES_DB: medinote
    volumes:
      - medinote_mac_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinote -d medinote"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medinote:medinote_local_only@db:5432/medinote
      TEST_BYPASS_AUTH: "false"
      ENABLE_API_DOCS: "true"
      MEDINOTE_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      SESSION_HOURS: "12"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api

volumes:
  medinote_mac_pgdata:
