services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env.pilot
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - medinote_pgdata:/var/lib/postgresql/data
    networks:
      - medinote_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env.pilot
    environment:
      DATABASE_URL: ${DATABASE_URL}
      MEDINOTE_ENVIRONMENT: ${MEDINOTE_ENVIRONMENT:-pilot}
      MEDINOTE_CORS_ORIGINS: ${MEDINOTE_CORS_ORIGINS}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      TEST_BYPASS_AUTH: "false"
      RETENTION_ENCRYPTION_KEY_HEX: ${RETENTION_ENCRYPTION_KEY_HEX}
      IMMUTABLE_STORE_PATH: /var/lib/medinote-immutable
      DEFAULT_RETENTION_DAYS: ${DEFAULT_RETENTION_DAYS:-2555}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - immutable_retention:/var/lib/medinote-immutable
    networks:
      - medinote_internal
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - medinote_internal
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file: .env.pilot
    environment:
      MEDINOTE_DOMAIN: ${MEDINOTE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - medinote_internal
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

networks:
  medinote_internal:
    driver: bridge

volumes:
  immutable_retention:
  medinote_pgdata:
  caddy_data:
  caddy_config:
