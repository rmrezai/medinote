services:
  - type: web
    name: medinote
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medinote-db
          property: connectionString
      - key: ENVIRONMENT
        value: pilot
      - key: TEST_BYPASS_AUTH
        value: "false"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: SESSION_HOURS
        value: "12"
      - key: IMMUTABLE_STORE_PATH
        value: /tmp/medinote-immutable
      - key: DEFAULT_RETENTION_DAYS
        value: "2555"

databases:
  - name: medinote-db
    plan: free
    region: virginia
    postgresMajorVersion: "16"
    databaseName: medinote
    user: medinote_app
    ipAllowList: []
