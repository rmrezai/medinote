services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medinote
      POSTGRES_PASSWORD: medinote
      POSTGRES_DB: medinote
    volumes:
      - medinote_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinote"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://medinote:medinote@db:5432/medinote
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  medinote_pgdata:
